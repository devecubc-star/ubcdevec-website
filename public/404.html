<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UBC Development Economics Club</title>
    <!--
      GitHub Pages serves this for any unmatched path. Stash the path the
      visitor actually wanted and bounce to index.html, which restores it
      via the inline script in index.html before React Router mounts.
    -->
    <script>
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body></body>
</html>
